<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carregando manual...</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ee;color:#123047;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .loader{max-width:560px;padding:32px;text-align:center}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#123047;animation:pulse 1s infinite alternate;margin:0 3px}
    .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
    @keyframes pulse{to{opacity:.25;transform:translateY(-5px)}}
  </style>
</head>
<body>
  <div class="loader" id="status">
    <h1>Carregando o manual visual</h1>
    <p><span class="dot"></span><span class="dot"></span><span class="dot"></span></p>
  </div>
  <script>
  (async function(){
    const files = Array.from({length:9},(_,i)=>`parts/part${String(i+1).padStart(2,'0')}.txt`);
    try {
      const parts = [];
      for (const file of files) {
        const response = await fetch(file,{cache:'no-cache'});
        if (!response.ok) throw new Error(`${file}: HTTP ${response.status}`);
        parts.push(await response.text());
      }
      let html = parts.join('');
      if (!html.includes('<!doctype html>') || !html.includes('</html>')) throw new Error('Conteúdo incompleto');

      html = html.replace(
        '<div class="sticky-tools"><button onclick="window.print()">Imprimir / PDF</button><button onclick="resetGuide()">Zerar progresso</button></div>',
        '<div class="sticky-tools"><button id="saveProgressBtn" onclick="saveGuide()">Salvar progresso</button><button onclick="window.print()">Imprimir / PDF</button><button onclick="resetGuide()">Zerar progresso</button></div>'
      );

      html = html.replace(
        '<div class="mini">Dica: marque as caixas ao longo do manual. O navegador salva seu progresso localmente.</div>',
        '<div class="mini">Dica: marque as caixas ao longo do manual. O navegador salva seu progresso localmente.<br><span id="lastSavedStatus">Nenhum salvamento manual ainda.</span></div>'
      );

      const saveEnhancement = `
<script>
(function(){
  function updateManualSaveStatus(){
    const el=document.getElementById('lastSavedStatus');
    if(!el)return;
    const raw=localStorage.getItem('unniguide-last-saved');
    if(!raw){el.textContent='Nenhum salvamento manual ainda.';return;}
    const d=new Date(raw);
    el.textContent='Último salvamento: '+d.toLocaleString('pt-BR')+' · neste navegador';
  }

  window.saveGuide=function(){
    document.querySelectorAll('[data-check]').forEach(c=>{
      localStorage.setItem('unniguide-check-'+c.dataset.check,c.checked?'1':'0');
    });
    document.querySelectorAll('[data-save]').forEach(inp=>{
      localStorage.setItem('unniguide-field-'+inp.dataset.save,inp.value);
    });
    localStorage.setItem('unniguide-saved-scroll',String(Math.max(0,Math.round(window.scrollY))));
    localStorage.setItem('unniguide-last-saved',new Date().toISOString());
    updateManualSaveStatus();
    const btn=document.getElementById('saveProgressBtn');
    if(btn){
      const old=btn.textContent;
      btn.textContent='Salvo ✓';
      btn.disabled=true;
      setTimeout(()=>{btn.textContent=old;btn.disabled=false;},1400);
    }
  };

  function initManualSave(){
    updateManualSaveStatus();
    const y=Number(localStorage.getItem('unniguide-saved-scroll')||0);
    if(Number.isFinite(y)&&y>0){setTimeout(()=>window.scrollTo(0,y),100);}
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initManualSave,{once:true});
  else initManualSave();
})();
<\/script>`;

      html = html.replace('</body>', saveEnhancement+'\n</body>');
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      document.getElementById('status').innerHTML = `<h1>Não foi possível carregar o manual</h1><p>${String(error.message || error)}</p><p>Atualize a página. Se o erro persistir, verifique os arquivos em <code>parts/</code>.</p>`;
    }
  })();
  </script>
</body>
</html>
